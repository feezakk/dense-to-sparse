defaults:
  seed: 0
  method: name
  task: dummy_disc
  logdir:  /dev/null
  replay: uniform
  replay_size: 100000
  replay_online: False
  eval_dir: ""
  filter: ".*"

  enable_bisim: True

  jax:
    platform: gpu
    jit: True
    precision: float16
    prealloc: False
    debug_nans: False
    logical_cpus: 0
    debug: False
    policy_devices: [0]
    train_devices: [0]
    metrics_every: 10

  run:
    script: train
    steps: 1e5
    expl_until: 0
    log_every: 60
    save_every: 10000
    eval_every: 10000
    eval_initial: True
    eval_eps: 10
    eval_samples: 1
    train_ratio: 512
    train_fill: 0
    eval_fill: 0
    log_zeros: False
    log_keys_video: [none]
    log_keys_sum: "^$"
    log_keys_mean: "(log_entropy)"
    log_keys_max: "^$"
    from_checkpoint: ""
    sync_every: 10

  envs:
    {
      amount: 1,
      parallel: process,
      length: 0,
      reset: True,
    }

  wrapper: { length: 0, reset: True, discretize: 0, checks: False }
  eval_temp: 0.5

  # Agent
  task_behavior: Greedy
  expl_behavior: None
  batch_size: 16
  batch_length: 64
  data_loaders: 8

  # World Model
  grad_heads: [decoder, reward, cont]
  rssm:
    {
      deter: 4096,
      units: 1024,
      stoch: 32,
      classes: 32,
      act: silu,
      norm: layer,
      initial: learned,
      unimix: 0.01,
      unroll: False,
      action_clip: 1.0,
      winit: normal,
      fan: avg,
    }
  encoder:
    {
      cnn_keys: "image",
      mlp_keys: "none",
      act: silu,
      norm: layer,
      mlp_layers: 2,
      mlp_units: 16,
      cnn: resnet,
      cnn_depth: 96,
      cnn_blocks: 0,
      resize: stride,
      winit: normal,
      fan: avg,
      symlog_inputs: True,
      minres: 4,
    }
  decoder:
    {
      cnn_keys: "image",
      mlp_keys: "none",
      act: silu,
      norm: layer,
      mlp_layers: 5,
      mlp_units: 1024,
      cnn: resnet,
      cnn_depth: 96,
      cnn_blocks: 0,
      image_dist: mse,
      vector_dist: symlog_mse,
      inputs: [deter, stoch],
      resize: stride,
      winit: normal,
      fan: avg,
      outscale: 1.0,
      minres: 4,
      cnn_sigmoid: False,
    }
  reward_head:
    {
      layers: 5,
      units: 1024,
      act: silu,
      norm: layer,
      dist: symlog_disc,
      outscale: 0.0,
      outnorm: False,
      inputs: [deter, stoch],
      winit: normal,
      fan: avg,
      bins: 255,
    }
  teacher_head:
    {
      layers: 4,
      units: 1024,
      act: silu,
      norm: layer,
      dist: mse,
      outscale: 1.0,
      inputs: [deter, stoch],
      winit: normal,
      fan: avg,
      bins: 0,
    }
  cont_head:
    {
      layers: 5,
      units: 1024,
      act: silu,
      norm: layer,
      dist: binary,
      outscale: 1.0,
      outnorm: False,
      inputs: [deter, stoch],
      winit: normal,
      fan: avg,
    }
  loss_scales:
    {
      image: 1.0,
      vector: 1.0,
      reward: 1.0,
      cont: 1.0,
      dyn: 0.5,
      rep: 0.1,
      actor: 1.0,
      critic: 1.0,
      slowreg: 1.0,
      posterior_deter_kl: 1.0,
      posterior_stoch_kl: 1.0,
      prior_deter_kl: 1.0,
      prior_stoch_kl: 1.0,
      dist_loss_imagined: 1.0 ,
      dist_deter_imagined: 1.0,
      dist_stoch_imagined: 1.0,
      bisim_pair: 0.5,   # start in [0.25, 1.0]  
      bisim_imag_reward_mse: 0.5,
      bisim_imag_next_kl: 0.1,
      bisim_imag_next_deter: 0.1,
      bisim_calib_reg: 1e-4
    }

  # --- bisimulation target (teacher) ---
  bisim_mode: "multi"          # {"single","multi"}; "multi" turns on the K-action aggregator
  bisim_K_actions: 3           # number of candidate actions K (>=1). K=1 ~= "single"
  bisim_agg: "softmax"         # {"softmax","max","mean"}
  bisim_tau: 0.5               # temperature for softmax aggregator (ignored for max/mean)

  # --- multi-step rollout for the transition gap ---
  bisim_ms_steps: 4          # H: steps of teacher img_step to include (>=1)
  bisim_ms_discount: 0.99      # discount for gaps across steps 1..H

  # --- action generation for continuous spaces ---
  bisim_delta: 0.25            # magnitude of +/- perturbation
  bisim_steer_dim: 0           # index of the steering dim (for continuous actions)

  # --- existing weights (keep yours if present) ---
  bisim_gamma: 0.99            # weights transition term inside d_T
  bisim_alpha_r: 1.0
  bisim_w_deter: 1.0
  bisim_w_stoch: 1.0

  bisim_ms_gamma: 0.99         # discount inside multi-step transition gap
  bisim_target_clip: 10.0    # clip for bisim target d_T

  bisim_dim: 128
  phi_head:
    {
      layers: 3,
      units: 1024,
      act: silu,
      norm: layer,
      inputs: [deter],
      winit: normal,
      fan: avg,
    }

  # bisim_dim: 128
  # phi_head:
  #   layers: [512, 512]
  #   act: silu


  dyn_loss: { impl: kl, free: 1.0 }
  rep_loss: { impl: kl, free: 1.0 }
  model_opt:
    {
      opt: adam,
      lr: 1e-4,
      eps: 1e-8,
      clip: 1000.0,
      wd: 0.0,
      warmup: 0,
      lateclip: 0.0,
    }

  # Actor Critic
  actor:
    {
      layers: 5,
      units: 1024,
      act: silu,
      norm: layer,
      minstd: 0.1,
      maxstd: 1.0,
      outscale: 1.0,
      outnorm: False,
      unimix: 0.01,
      inputs: [deter, stoch],
      winit: normal,
      fan: avg,
      symlog_inputs: False,
    }
  critic:
    {
      layers: 5,
      units: 1024,
      act: silu,
      norm: layer,
      dist: symlog_disc,
      outscale: 0.0,
      outnorm: False,
      inputs: [deter, stoch],
      winit: normal,
      fan: avg,
      bins: 255,
      symlog_inputs: False,
    }
  actor_opt:
    {
      opt: adam,
      lr: 3e-5,
      eps: 1e-5,
      clip: 100.0,
      wd: 0.0,
      warmup: 0,
      lateclip: 0.0,
    }
  critic_opt:
    {
      opt: adam,
      lr: 3e-5,
      eps: 1e-5,
      clip: 100.0,
      wd: 0.0,
      warmup: 0,
      lateclip: 0.0,
    }
  actor_dist_disc: onehot
  actor_dist_cont: normal
  actor_grad_disc: reinforce
  actor_grad_cont: backprop
  critic_type: vfunction
  imag_horizon: 15
  imag_unroll: False
  horizon: 333
  return_lambda: 0.95
  critic_slowreg: logprob
  slow_critic_update: 1
  slow_critic_fraction: 0.02
  retnorm: { impl: perc_ema, decay: 0.99, max: 1.0, perclo: 5.0, perchi: 95.0 }
  actent: 3e-4

  # Exploration
  expl_rewards: { extr: 1.0, disag: 0.1 }
  expl_opt: { opt: adam, lr: 1e-4, eps: 1e-5, clip: 100.0, wd: 0.0, warmup: 0 }
  disag_head:
    {
      layers: 5,
      units: 1024,
      act: silu,
      norm: layer,
      dist: mse,
      outscale: 1.0,
      inputs: [deter, stoch, action],
      winit: normal,
      fan: avg,
    }
  disag_target: [stoch]
  disag_models: 8

  # Replay Configuration
  replay_hyper:
    {
      initial_priority: 1e5,
      c: 1e4,
      beta: 0.7,
      epsilon: 0.01,
      alpha: 0.7,
      key_find_priority: 1e7,
    }

  teacher_reward_scale: 100.0
